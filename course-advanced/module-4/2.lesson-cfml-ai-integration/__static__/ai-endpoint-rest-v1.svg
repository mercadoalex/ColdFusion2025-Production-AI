<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,system-ui,sans-serif">
  <!-- Background -->
  <rect width="960" height="520" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="1">REST ENDPOINT FLOW — /api/ai-chat.cfm</text>

  <!-- ── Column headers ── -->
  <!-- Client -->
  <rect x="30" y="55" width="130" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="95" y="77" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">CLIENT</text>

  <!-- ai-chat.cfm -->
  <rect x="230" y="55" width="360" height="34" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="77" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">/api/ai-chat.cfm</text>

  <!-- OllamaService -->
  <rect x="660" y="55" width="160" height="34" rx="6" fill="#1e3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="740" y="77" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">OllamaService.cfc</text>

  <!-- ── Swimlane backgrounds ── -->
  <rect x="30"  y="100" width="130" height="380" rx="6" fill="#0f1f35" opacity="0.5"/>
  <rect x="230" y="100" width="360" height="380" rx="6" fill="#0f1f35" opacity="0.5"/>
  <rect x="660" y="100" width="160" height="380" rx="6" fill="#0d1f17" opacity="0.5"/>

  <!-- ── Flow steps ── -->

  <!-- Step 1: GET request -->
  <rect x="40" y="118" width="110" height="32" rx="5" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="95"  y="134" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">GET request</text>
  <text x="95"  y="146" text-anchor="middle" fill="#64748b" font-size="10">/api/ai-chat.cfm</text>

  <!-- arrow right -->
  <line x1="150" y1="134" x2="230" y2="134" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="228,130 236,134 228,138" fill="#3b82f6"/>

  <!-- Step 2: Check METHOD -->
  <rect x="240" y="110" width="175" height="50" rx="5" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="327" y="130" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">METHOD == "GET"?</text>
  <text x="327" y="148" text-anchor="middle" fill="#64748b" font-size="10">cgi.REQUEST_METHOD</text>

  <!-- yes arrow (down-right) to GET response -->
  <line x1="415" y1="135" x2="490" y2="135" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="488,131 496,135 488,139" fill="#22c55e"/>
  <text x="452" y="127" text-anchor="middle" fill="#86efac" font-size="10">YES</text>

  <!-- GET health response -->
  <rect x="496" y="110" width="175" height="50" rx="5" fill="#14532d" stroke="#22c55e"/>
  <text x="583" y="130" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">200 OK — health JSON</text>
  <text x="583" y="148" text-anchor="middle" fill="#64748b" font-size="10">{"status":"ok","model":"phi3:mini"}</text>

  <!-- no arrow down -->
  <line x1="327" y1="160" x2="327" y2="190" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="323,188 327,196 331,188" fill="#f59e0b"/>
  <text x="305" y="180" fill="#fbbf24" font-size="10">NO</text>

  <!-- Step 3: Validate body -->
  <rect x="240" y="196" width="175" height="50" rx="5" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="327" y="216" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Valid JSON body?</text>
  <text x="327" y="234" text-anchor="middle" fill="#64748b" font-size="10">toString() + isJSON()</text>

  <!-- invalid arrow right -->
  <line x1="415" y1="221" x2="496" y2="221" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="494,217 502,221 494,225" fill="#ef4444"/>
  <text x="454" y="213" text-anchor="middle" fill="#fca5a5" font-size="10">INVALID</text>

  <!-- 400 error box -->
  <rect x="496" y="196" width="175" height="50" rx="5" fill="#450a0a" stroke="#ef4444"/>
  <text x="583" y="216" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">400 Bad Request</text>
  <text x="583" y="234" text-anchor="middle" fill="#64748b" font-size="10">{"error":"JSON body required"}</text>

  <!-- valid arrow down -->
  <line x1="327" y1="246" x2="327" y2="276" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="323,274 327,282 331,274" fill="#22c55e"/>
  <text x="340" y="265" fill="#86efac" font-size="10">VALID</text>

  <!-- Step 4: Extract fields -->
  <rect x="240" y="282" width="175" height="50" rx="5" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="327" y="302" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Extract fields</text>
  <text x="327" y="320" text-anchor="middle" fill="#64748b" font-size="10">prompt, system (optional)</text>

  <!-- arrow down -->
  <line x1="327" y1="332" x2="327" y2="362" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="323,360 327,368 331,360" fill="#3b82f6"/>

  <!-- Step 5: svc.chat() -->
  <rect x="240" y="368" width="175" height="50" rx="5" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="327" y="388" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">svc.chat(messages)</text>
  <text x="327" y="406" text-anchor="middle" fill="#64748b" font-size="10">OllamaService.cfc</text>

  <!-- arrow right to OllamaService -->
  <line x1="415" y1="393" x2="660" y2="393" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="658,389 666,393 658,397" fill="#22c55e"/>
  <text x="537" y="383" text-anchor="middle" fill="#86efac" font-size="10">delegate call</text>

  <!-- OllamaService box -->
  <rect x="670" y="368" width="140" height="50" rx="5" fill="#14532d" stroke="#22c55e"/>
  <text x="740" y="388" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">chat() → cfhttp</text>
  <text x="740" y="406" text-anchor="middle" fill="#64748b" font-size="10">POST /api/chat</text>

  <!-- return arrow -->
  <line x1="670" y1="430" x2="415" y2="430" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="417,426 409,430 417,434" fill="#a78bfa"/>
  <text x="543" y="445" text-anchor="middle" fill="#a78bfa" font-size="10">AI response string</text>

  <!-- arrow down to 200 response -->
  <line x1="327" y1="418" x2="327" y2="448" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="323,446 327,454 331,446" fill="#3b82f6"/>

  <!-- Step 6: 200 response -->
  <rect x="240" y="454" width="175" height="32" rx="5" fill="#14532d" stroke="#22c55e"/>
  <text x="327" y="475" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">200 — {"response":"…","model":"…"}</text>

  <!-- 503 error path -->
  <!-- catch block on left side -->
  <rect x="496" y="368" width="155" height="50" rx="5" fill="#450a0a" stroke="#ef4444"/>
  <text x="573" y="388" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">503 Unavailable</text>
  <text x="573" y="406" text-anchor="middle" fill="#64748b" font-size="10">OllamaService.Error</text>

  <!-- curved error path label -->
  <text x="455" y="360" text-anchor="middle" fill="#fca5a5" font-size="10">cfcatch</text>

  <!-- ── Legend ── -->
  <rect x="30" y="495" width="10" height="10" rx="2" fill="#3b82f6"/>
  <text x="46" y="504" fill="#64748b" font-size="10">normal flow</text>
  <rect x="130" y="495" width="10" height="10" rx="2" fill="#22c55e"/>
  <text x="146" y="504" fill="#64748b" font-size="10">success path</text>
  <rect x="230" y="495" width="10" height="10" rx="2" fill="#ef4444"/>
  <text x="246" y="504" fill="#64748b" font-size="10">error path</text>
  <rect x="330" y="495" width="10" height="10" rx="2" fill="#a78bfa"/>
  <text x="346" y="504" fill="#64748b" font-size="10">return value</text>
</svg>
