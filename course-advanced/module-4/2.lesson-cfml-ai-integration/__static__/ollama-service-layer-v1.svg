<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">OllamaService.cfc — reusable service layer pattern</text>

  <!-- ─── Callers (left column) ─── -->
  <rect x="30" y="70" width="160" height="60" rx="8" fill="#eff6ff" stroke="#3b82d4" stroke-width="1.8"/>
  <text x="110" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">ai-chat.cfm</text>
  <text x="110" y="115" text-anchor="middle" font-size="10" fill="#57606a">REST endpoint</text>

  <rect x="30" y="160" width="160" height="60" rx="8" fill="#eff6ff" stroke="#3b82d4" stroke-width="1.8"/>
  <text x="110" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">ticket-summary.cfm</text>
  <text x="110" y="205" text-anchor="middle" font-size="10" fill="#57606a">Admin page</text>

  <rect x="30" y="250" width="160" height="60" rx="8" fill="#eff6ff" stroke="#3b82d4" stroke-width="1.8"/>
  <text x="110" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">HelpDesk.cfc</text>
  <text x="110" y="295" text-anchor="middle" font-size="10" fill="#57606a">Service component</text>

  <rect x="30" y="340" width="160" height="60" rx="8" fill="#eff6ff" stroke="#3b82d4" stroke-width="1.8"/>
  <text x="110" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">scheduled-job.cfm</text>
  <text x="110" y="385" text-anchor="middle" font-size="10" fill="#57606a">Batch processor</text>

  <!-- Arrows → service -->
  <line x1="192" y1="100" x2="290" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="192" y1="190" x2="290" y2="220" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="192" y1="280" x2="290" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="192" y1="370" x2="290" y2="280" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── OllamaService.cfc (centre) ─── -->
  <rect x="290" y="140" width="240" height="190" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">OllamaService.cfc</text>

  <rect x="310" y="182" width="200" height="30" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="410" y="202" text-anchor="middle" font-size="11" font-family="'Courier New', monospace" fill="#15803d">generate(prompt, temp)</text>

  <rect x="310" y="220" width="200" height="30" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="410" y="240" text-anchor="middle" font-size="11" font-family="'Courier New', monospace" fill="#15803d">chat(messages[], temp)</text>

  <line x1="310" y1="265" x2="490" y2="265" stroke="#d1fae5" stroke-width="1"/>
  <text x="410" y="285" text-anchor="middle" font-size="10" fill="#57606a">private:</text>
  <rect x="310" y="290" width="200" height="30" rx="5" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="410" y="310" text-anchor="middle" font-size="11" font-family="'Courier New', monospace" fill="#374151">makeRequest(path, payload)</text>

  <!-- Arrow → Ollama -->
  <line x1="532" y1="235" x2="620" y2="235" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="576" y="228" text-anchor="middle" font-size="10" fill="#57606a">cfhttp POST</text>

  <!-- ─── Ollama (right) ─── -->
  <rect x="622" y="160" width="150" height="150" rx="10" fill="#faf5ff" stroke="#7c5cd8" stroke-width="2"/>
  <text x="697" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Ollama</text>
  <text x="697" y="210" text-anchor="middle" font-size="11" fill="#374151">phi3:mini</text>
  <text x="697" y="228" text-anchor="middle" font-size="11" fill="#374151">:11434</text>
  <line x1="640" y1="242" x2="754" y2="242" stroke="#e9d5ff" stroke-width="1"/>
  <text x="697" y="260" text-anchor="middle" font-size="10" fill="#57606a">/api/generate</text>
  <text x="697" y="278" text-anchor="middle" font-size="10" fill="#57606a">/api/chat</text>
  <text x="697" y="296" text-anchor="middle" font-size="10" fill="#57606a">/api/tags</text>

  <!-- ─── config block ─── -->
  <rect x="622" y="340" width="250" height="100" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="747" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">One place to change config</text>
  <text x="635" y="380" font-size="10" font-family="'Courier New', monospace" fill="#374151">variables.baseUrl   = "http://ollama:11434"</text>
  <text x="635" y="396" font-size="10" font-family="'Courier New', monospace" fill="#374151">variables.model     = "phi3:mini"</text>
  <text x="635" y="412" font-size="10" font-family="'Courier New', monospace" fill="#374151">variables.maxTokens = 512</text>
  <text x="635" y="428" font-size="10" font-family="'Courier New', monospace" fill="#374151">variables.timeout   = 120</text>

  <!-- Caption -->
  <text x="450" y="480" text-anchor="middle" font-size="12" fill="#57606a" font-style="italic">Multiple callers share one service — change the model or URL in one place and every caller inherits it.</text>
</svg>
