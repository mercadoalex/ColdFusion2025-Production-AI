<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">CFML → OllamaService → cfhttp → Ollama API</text>

  <!-- ─── Row 1: CFML Page ─── -->
  <!-- Box 1: CFML Page -->
  <rect x="30" y="70" width="180" height="100" rx="8" fill="#eff6ff" stroke="#3b82d4" stroke-width="1.8"/>
  <text x="120" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">CFML Page</text>
  <text x="120" y="132" text-anchor="middle" font-size="11" fill="#374151">ai_test.cfm</text>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#374151">or any .cfm/.cfc</text>

  <!-- Arrow 1→2 -->
  <line x1="212" y1="120" x2="270" y2="120" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="241" y="113" text-anchor="middle" font-size="10" fill="#57606a">calls</text>

  <!-- Box 2: OllamaService.cfc -->
  <rect x="272" y="70" width="200" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="372" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">OllamaService.cfc</text>
  <text x="372" y="128" text-anchor="middle" font-size="11" fill="#374151">generate(prompt)</text>
  <text x="372" y="146" text-anchor="middle" font-size="11" fill="#374151">chat(messages[])</text>

  <!-- Arrow 2→3 -->
  <line x1="474" y1="120" x2="530" y2="120" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="502" y="113" text-anchor="middle" font-size="10" fill="#57606a">HTTP POST</text>

  <!-- Box 3: cfhttp -->
  <rect x="532" y="70" width="160" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="612" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">cfhttp</text>
  <text x="612" y="128" text-anchor="middle" font-size="11" fill="#374151">method="POST"</text>
  <text x="612" y="146" text-anchor="middle" font-size="11" fill="#374151">timeout=120</text>

  <!-- Arrow 3→4 -->
  <line x1="694" y1="120" x2="750" y2="120" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="722" y="113" text-anchor="middle" font-size="10" fill="#57606a">TCP/HTTP</text>

  <!-- Box 4: Ollama API -->
  <rect x="752" y="70" width="120" height="100" rx="8" fill="#faf5ff" stroke="#7c5cd8" stroke-width="1.8"/>
  <text x="812" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Ollama</text>
  <text x="812" y="128" text-anchor="middle" font-size="11" fill="#374151">phi3:mini</text>
  <text x="812" y="146" text-anchor="middle" font-size="11" fill="#374151">:11434</text>

  <!-- ─── Divider line ─── -->
  <line x1="30" y1="200" x2="872" y2="200" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ─── Row 2: Return path ─── -->
  <!-- Return arrow 4→3 -->
  <line x1="750" y1="280" x2="694" y2="280" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="722" y="273" text-anchor="middle" font-size="10" fill="#57606a">JSON body</text>

  <!-- Return arrow 3→2 -->
  <line x1="530" y1="280" x2="474" y2="280" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="502" y="273" text-anchor="middle" font-size="10" fill="#57606a">fileContent</text>

  <!-- Return arrow 2→1 -->
  <line x1="270" y1="280" x2="212" y2="280" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="241" y="273" text-anchor="middle" font-size="10" fill="#57606a">string</text>

  <!-- Box 4 bottom (return) -->
  <rect x="752" y="230" width="120" height="80" rx="8" fill="#faf5ff" stroke="#7c5cd8" stroke-width="1.8"/>
  <text x="812" y="268" text-anchor="middle" font-size="11" fill="#374151">{"response":</text>
  <text x="812" y="286" text-anchor="middle" font-size="11" fill="#374151">"...text..."}</text>

  <!-- Box 3 bottom -->
  <rect x="532" y="230" width="160" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="612" y="262" text-anchor="middle" font-size="11" fill="#374151">deserializeJSON(</text>
  <text x="612" y="278" text-anchor="middle" font-size="11" fill="#374151">  fileContent</text>
  <text x="612" y="294" text-anchor="middle" font-size="11" fill="#374151">)</text>

  <!-- Box 2 bottom -->
  <rect x="272" y="230" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="372" y="262" text-anchor="middle" font-size="11" fill="#374151">result.response</text>
  <text x="372" y="280" text-anchor="middle" font-size="11" fill="#57606a">or</text>
  <text x="372" y="296" text-anchor="middle" font-size="11" fill="#374151">result.message.content</text>

  <!-- Box 1 bottom -->
  <rect x="30" y="230" width="180" height="80" rx="8" fill="#eff6ff" stroke="#3b82d4" stroke-width="1.8"/>
  <text x="120" y="268" text-anchor="middle" font-size="11" fill="#374151">writeOutput(</text>
  <text x="120" y="286" text-anchor="middle" font-size="11" fill="#374151">  reply</text>
  <text x="120" y="304" text-anchor="middle" font-size="11" fill="#374151">)</text>

  <!-- ─── Labels ─── -->
  <text x="450" y="370" text-anchor="middle" font-size="12" fill="#57606a" font-style="italic">Request flow (top) and response path (bottom)</text>

  <!-- ─── Endpoint annotations ─── -->
  <rect x="150" y="400" width="260" height="50" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="280" y="422" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">generate()  →  /api/generate</text>
  <text x="280" y="440" text-anchor="middle" font-size="11" fill="#57606a">Single prompt · response field</text>

  <rect x="490" y="400" width="260" height="50" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="620" y="422" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">chat()  →  /api/chat</text>
  <text x="620" y="440" text-anchor="middle" font-size="11" fill="#57606a">messages[] · message.content field</text>

  <!-- ─── Arrow markers ─── -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6d28d9"/>
    </marker>
  </defs>
</svg>
