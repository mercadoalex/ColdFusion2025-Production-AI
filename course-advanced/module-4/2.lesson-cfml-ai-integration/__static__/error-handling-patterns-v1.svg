<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,system-ui,sans-serif">
  <!-- Background -->
  <rect width="960" height="480" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="1">ERROR HANDLING PATTERNS — AI CALLS IN CFML</text>

  <!-- ── Pattern 1 ── -->
  <rect x="30" y="55" width="280" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="170" y="75" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Pattern 1 — Fallback Message</text>

  <rect x="30" y="95" width="280" height="120" rx="6" fill="#1e293b" stroke="#334155"/>
  <!-- try block -->
  <rect x="42" y="105" width="256" height="48" rx="4" fill="#0f2039" stroke="#3b82f6" stroke-width="1"/>
  <text x="170" y="121" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">try { }</text>
  <text x="170" y="137" text-anchor="middle" fill="#cbd5e1" font-size="10">reply = svc.generate(prompt)</text>
  <text x="170" y="151" text-anchor="middle" fill="#64748b" font-size="10">← normal path ✓</text>
  <!-- catch block -->
  <rect x="42" y="162" width="256" height="42" rx="4" fill="#1c0a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="170" y="178" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">catch (OllamaService.Error)</text>
  <text x="170" y="195" text-anchor="middle" fill="#cbd5e1" font-size="10">reply = "AI unavailable — try again"</text>

  <!-- label below -->
  <text x="170" y="232" text-anchor="middle" fill="#64748b" font-size="10">Best for: public pages, chatbots</text>

  <!-- ── Pattern 2 ── -->
  <rect x="340" y="55" width="280" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="75" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Pattern 2 — Timeout Detection</text>

  <rect x="340" y="95" width="280" height="120" rx="6" fill="#1e293b" stroke="#334155"/>
  <!-- try block -->
  <rect x="352" y="105" width="256" height="48" rx="4" fill="#0f2039" stroke="#3b82f6" stroke-width="1"/>
  <text x="480" y="121" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">try { }</text>
  <text x="480" y="137" text-anchor="middle" fill="#cbd5e1" font-size="10">reply = svc.generate(prompt)</text>
  <text x="480" y="151" text-anchor="middle" fill="#64748b" font-size="10">← model warm: 1–10 s</text>
  <!-- catch block -->
  <rect x="352" y="162" width="256" height="42" rx="4" fill="#1c0a0a" stroke="#f59e0b" stroke-width="1"/>
  <text x="480" y="178" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">catch — check e.message</text>
  <text x="480" y="195" text-anchor="middle" fill="#cbd5e1" font-size="10">contains "timeout"? → warm-up msg</text>

  <text x="480" y="232" text-anchor="middle" fill="#64748b" font-size="10">Best for: endpoints that distinguish slow vs broken</text>

  <!-- ── Pattern 3 ── -->
  <rect x="650" y="55" width="280" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="790" y="75" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Pattern 3 — Retry Backoff</text>

  <rect x="650" y="95" width="280" height="120" rx="6" fill="#1e293b" stroke="#334155"/>
  <!-- while block -->
  <rect x="662" y="105" width="256" height="48" rx="4" fill="#0f2039" stroke="#a78bfa" stroke-width="1"/>
  <text x="790" y="121" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">while (attempt ≤ 3)</text>
  <text x="790" y="137" text-anchor="middle" fill="#cbd5e1" font-size="10">try { svc.generate() } ← attempt 1</text>
  <text x="790" y="151" text-anchor="middle" fill="#64748b" font-size="10">sleep 2 s → attempt 2 → sleep 4 s</text>
  <!-- catch/else block -->
  <rect x="662" y="162" width="256" height="42" rx="4" fill="#1c0818" stroke="#a78bfa" stroke-width="1"/>
  <text x="790" y="178" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">still empty after 3 tries?</text>
  <text x="790" y="195" text-anchor="middle" fill="#cbd5e1" font-size="10">reply = "AI unavailable after 3 attempts"</text>

  <text x="790" y="232" text-anchor="middle" fill="#64748b" font-size="10">Best for: critical automation, batch jobs</text>

  <!-- ── Error type decision tree ── -->
  <text x="480" y="268" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">Which cfcatch type to use?</text>

  <!-- Narrow type -->
  <rect x="100" y="284" width="330" height="88" rx="6" fill="#0f2039" stroke="#22c55e" stroke-width="1.5"/>
  <text x="265" y="304" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">✓  cfcatch type="OllamaService.Error"</text>
  <text x="265" y="322" text-anchor="middle" fill="#cbd5e1" font-size="10">Only catches errors from OllamaService.cfc</text>
  <text x="265" y="338" text-anchor="middle" fill="#cbd5e1" font-size="10">Bugs in your own code still surface visibly</text>
  <text x="265" y="354" text-anchor="middle" fill="#64748b" font-size="10">Use this as your FIRST cfcatch</text>
  <text x="265" y="370" text-anchor="middle" fill="#64748b" font-size="10">→ Handle gracefully with a user-friendly message</text>

  <!-- Wide type -->
  <rect x="530" y="284" width="330" height="88" rx="6" fill="#1c0a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="695" y="304" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">⚠  cfcatch type="Any"</text>
  <text x="695" y="322" text-anchor="middle" fill="#cbd5e1" font-size="10">Catches ALL exceptions — including your own bugs</text>
  <text x="695" y="338" text-anchor="middle" fill="#cbd5e1" font-size="10">Masks NullPointerException, syntax errors, etc.</text>
  <text x="695" y="354" text-anchor="middle" fill="#64748b" font-size="10">If used, add as SECOND cfcatch after the specific one</text>
  <text x="695" y="370" text-anchor="middle" fill="#64748b" font-size="10">→ Log cfcatch.stackTrace to your error tracker</text>

  <!-- vs label -->
  <text x="480" y="332" text-anchor="middle" fill="#475569" font-size="13" font-weight="700">vs</text>

  <!-- ── Cold-start warning ── -->
  <rect x="100" y="388" width="760" height="62" rx="6" fill="#1c1000" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="408" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">⏱  Cold-start: first request after restart takes 30–90 seconds</text>
  <text x="480" y="426" text-anchor="middle" fill="#cbd5e1" font-size="10">Model is loaded into RAM on the first call. Subsequent requests take 1–10 s. Set cfhttp timeout="120" unconditionally.</text>
  <text x="480" y="444" text-anchor="middle" fill="#64748b" font-size="10">If you see "Connection timed out" → restart Ollama with: sudo systemctl restart ollama, then wait 30 s and retry.</text>
</svg>
