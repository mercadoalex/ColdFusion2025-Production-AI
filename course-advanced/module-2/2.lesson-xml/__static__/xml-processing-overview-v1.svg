<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,system-ui,sans-serif">
  <rect width="960" height="420" fill="#0f172a" rx="12"/>
  <text x="480" y="32" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="1">XML PROCESSING IN COLDFUSION — THREE OPERATIONS</text>

  <!-- Panel 1: Parse -->
  <rect x="30" y="50" width="270" height="340" rx="8" fill="#0f1f35" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="30" y="50" width="270" height="36" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="73" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">① PARSE</text>

  <rect x="50" y="98" width="230" height="50" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="165" y="118" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">XmlParse(xmlString)</text>
  <text x="165" y="136" text-anchor="middle" fill="#64748b" font-size="10">string / URL → CF XML object</text>

  <text x="165" y="168" text-anchor="middle" fill="#64748b" font-size="10">Input sources:</text>
  <rect x="50" y="175" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="165" y="190" text-anchor="middle" fill="#93c5fd" font-size="10">API response body (XML string)</text>
  <rect x="50" y="200" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="165" y="215" text-anchor="middle" fill="#93c5fd" font-size="10">File path via expandPath()</text>
  <rect x="50" y="225" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="165" y="240" text-anchor="middle" fill="#93c5fd" font-size="10">SOAP web service envelope</text>

  <rect x="50" y="260" width="230" height="50" rx="4" fill="#0f2039" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="165" y="279" text-anchor="middle" fill="#64748b" font-size="10">Result: CF XML object</text>
  <text x="165" y="297" text-anchor="middle" fill="#93c5fd" font-size="11">doc.xmlRoot.xmlName</text>

  <text x="165" y="340" text-anchor="middle" fill="#64748b" font-size="10">Also: XmlNew() to create from scratch</text>
  <text x="165" y="358" text-anchor="middle" fill="#64748b" font-size="10">cfxml tag for inline markup</text>

  <!-- Arrow 1→2 -->
  <line x1="300" y1="220" x2="345" y2="220" stroke="#475569" stroke-width="2"/>
  <polygon points="343,216 351,220 343,224" fill="#475569"/>

  <!-- Panel 2: Query (XPath) -->
  <rect x="345" y="50" width="270" height="340" rx="8" fill="#0d1f17" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="345" y="50" width="270" height="36" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="73" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">② QUERY WITH XPATH</text>

  <rect x="365" y="98" width="230" height="50" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="118" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">XmlSearch(doc, xpathExpr)</text>
  <text x="480" y="136" text-anchor="middle" fill="#64748b" font-size="10">returns array of matching nodes</text>

  <text x="480" y="166" text-anchor="middle" fill="#64748b" font-size="10">Common expressions:</text>
  <rect x="365" y="173" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="480" y="188" text-anchor="middle" fill="#86efac" font-size="10">//ticket  →  all ticket nodes</text>
  <rect x="365" y="198" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="480" y="213" text-anchor="middle" fill="#86efac" font-size="10">//@priority='high'  →  by attribute</text>
  <rect x="365" y="223" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="480" y="238" text-anchor="middle" fill="#86efac" font-size="10">//ticket[1]  →  first only</text>
  <rect x="365" y="248" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="480" y="263" text-anchor="middle" fill="#86efac" font-size="10">string(//title)  →  text value</text>

  <rect x="365" y="283" width="230" height="50" rx="4" fill="#0d1f17" stroke="#22c55e" stroke-width="0.5"/>
  <text x="480" y="302" text-anchor="middle" fill="#64748b" font-size="10">Access result node:</text>
  <text x="480" y="320" text-anchor="middle" fill="#86efac" font-size="11">nodes[1].XmlText</text>

  <text x="480" y="358" text-anchor="middle" fill="#64748b" font-size="10">nodes[1].XmlAttributes.id</text>

  <!-- Arrow 2→3 -->
  <line x1="615" y1="220" x2="660" y2="220" stroke="#475569" stroke-width="2"/>
  <polygon points="658,216 666,220 658,224" fill="#475569"/>

  <!-- Panel 3: Transform (XSLT) -->
  <rect x="660" y="50" width="270" height="340" rx="8" fill="#1c0818" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="660" y="50" width="270" height="36" rx="8" fill="#2d1b4e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="795" y="73" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">③ TRANSFORM WITH XSLT</text>

  <rect x="680" y="98" width="230" height="50" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="795" y="118" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">XmlTransform(xmlDoc, xslDoc)</text>
  <text x="795" y="136" text-anchor="middle" fill="#64748b" font-size="10">XML + stylesheet → new output</text>

  <text x="795" y="166" text-anchor="middle" fill="#64748b" font-size="10">Output formats:</text>
  <rect x="680" y="173" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="795" y="188" text-anchor="middle" fill="#c4b5fd" font-size="10">HTML table / report page</text>
  <rect x="680" y="198" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="795" y="213" text-anchor="middle" fill="#c4b5fd" font-size="10">Plain text / CSV</text>
  <rect x="680" y="223" width="230" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="795" y="238" text-anchor="middle" fill="#c4b5fd" font-size="10">Different XML vocabulary</text>

  <rect x="680" y="260" width="230" height="50" rx="4" fill="#1c0818" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="795" y="279" text-anchor="middle" fill="#64748b" font-size="10">XSLT template matches:</text>
  <text x="795" y="297" text-anchor="middle" fill="#c4b5fd" font-size="11">xsl:for-each, xsl:value-of</text>

  <text x="795" y="340" text-anchor="middle" fill="#64748b" font-size="10">XmlFormat() for safe embedding</text>
  <text x="795" y="358" text-anchor="middle" fill="#64748b" font-size="10">toString(xmlDoc) → string</text>
</svg>
