<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,system-ui,sans-serif">
  <rect width="960" height="420" fill="#0f172a" rx="12"/>
  <text x="480" y="34" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="1">DOCKER BUILD → REGISTRY → cf-prod DEPLOY</text>

  <!-- cf-dev box -->
  <rect x="30" y="60" width="240" height="300" rx="8" fill="#0f1f35" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="85" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">cf-dev VM</text>
  <text x="150" y="102" text-anchor="middle" fill="#64748b" font-size="10">build machine</text>

  <!-- source files -->
  <rect x="50" y="116" width="200" height="36" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="150" y="131" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Source files</text>
  <text x="150" y="146" text-anchor="middle" fill="#64748b" font-size="10">app/index.cfm + Dockerfile</text>

  <!-- arrow -->
  <line x1="150" y1="152" x2="150" y2="172" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="146,170 150,178 154,170" fill="#3b82f6"/>

  <!-- docker build -->
  <rect x="50" y="178" width="200" height="36" rx="4" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="150" y="193" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">docker build</text>
  <text x="150" y="208" text-anchor="middle" fill="#64748b" font-size="10">-t localhost:5000/cf-app:&lt;sha&gt;</text>

  <!-- arrow -->
  <line x1="150" y1="214" x2="150" y2="234" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="146,232 150,240 154,232" fill="#3b82f6"/>

  <!-- image layer stack -->
  <rect x="50" y="240" width="200" height="14" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="150" y="251" text-anchor="middle" fill="#93c5fd" font-size="9">Layer: app code (COPY app/)</text>
  <rect x="50" y="255" width="200" height="14" rx="2" fill="#1e3a2a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="150" y="266" text-anchor="middle" fill="#86efac" font-size="9">Layer: CF runtime (adobecoldfusion/...)</text>
  <rect x="50" y="270" width="200" height="14" rx="2" fill="#1e1b4b" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="150" y="281" text-anchor="middle" fill="#c4b5fd" font-size="9">Layer: OS base (Ubuntu/Debian)</text>

  <text x="150" y="304" text-anchor="middle" fill="#64748b" font-size="10">cf-app:a3f82c9</text>

  <!-- arrow right to registry -->
  <line x1="270" y1="200" x2="360" y2="200" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="358,196 366,200 358,204" fill="#a78bfa"/>
  <text x="313" y="191" text-anchor="middle" fill="#a78bfa" font-size="10">docker push</text>

  <!-- registry box -->
  <rect x="360" y="60" width="220" height="300" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="470" y="85" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Local Registry</text>
  <text x="470" y="102" text-anchor="middle" fill="#64748b" font-size="10">localhost:5000</text>

  <!-- image tags in registry -->
  <rect x="380" y="120" width="180" height="30" rx="4" fill="#312e81" stroke="#6366f1"/>
  <text x="470" y="132" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">cf-app:a3f82c9  ← latest</text>
  <text x="470" y="145" text-anchor="middle" fill="#64748b" font-size="9">pushed 2 min ago</text>

  <rect x="380" y="160" width="180" height="30" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.5"/>
  <text x="470" y="172" text-anchor="middle" fill="#818cf8" font-size="10">cf-app:b7c14d2</text>
  <text x="470" y="185" text-anchor="middle" fill="#64748b" font-size="9">yesterday</text>

  <rect x="380" y="200" width="180" height="30" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.5"/>
  <text x="470" y="212" text-anchor="middle" fill="#818cf8" font-size="10">cf-app:e91fa55</text>
  <text x="470" y="225" text-anchor="middle" fill="#64748b" font-size="9">3 days ago</text>

  <!-- rollback annotation -->
  <text x="470" y="272" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">⟵ rollback = docker run image:b7c14d2</text>
  <text x="470" y="288" text-anchor="middle" fill="#64748b" font-size="9">10 seconds, no guessing</text>

  <!-- arrow right to cf-prod -->
  <line x1="580" y1="200" x2="660" y2="200" stroke="#22c55e" stroke-width="2"/>
  <polygon points="658,196 666,200 658,204" fill="#22c55e"/>
  <text x="620" y="191" text-anchor="middle" fill="#86efac" font-size="10">docker pull</text>
  <text x="620" y="213" text-anchor="middle" fill="#86efac" font-size="10">+ docker run</text>

  <!-- cf-prod box -->
  <rect x="660" y="60" width="270" height="300" rx="8" fill="#0d1f17" stroke="#22c55e" stroke-width="1.5"/>
  <text x="795" y="85" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">cf-prod VM</text>
  <text x="795" y="102" text-anchor="middle" fill="#64748b" font-size="10">production deployment target</text>

  <!-- running container -->
  <rect x="680" y="120" width="230" height="50" rx="4" fill="#14532d" stroke="#22c55e"/>
  <text x="795" y="141" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">Container: cf-app:a3f82c9</text>
  <text x="795" y="158" text-anchor="middle" fill="#64748b" font-size="10">running on port 8500</text>

  <!-- health check -->
  <rect x="680" y="182" width="230" height="38" rx="4" fill="#1e3a2a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="795" y="198" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">HEALTHCHECK: curl /index.cfm</text>
  <text x="795" y="212" text-anchor="middle" fill="#64748b" font-size="9">CF marked healthy after 60 s start period</text>

  <!-- user traffic -->
  <rect x="680" y="232" width="230" height="38" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="795" y="248" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">User traffic</text>
  <text x="795" y="263" text-anchor="middle" fill="#64748b" font-size="9">requests routed to healthy container only</text>

  <!-- SHA tag annotation -->
  <rect x="680" y="282" width="230" height="50" rx="4" fill="#292524" stroke="#57534e"/>
  <text x="795" y="299" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Every deploy = a commit SHA</text>
  <text x="795" y="314" text-anchor="middle" fill="#64748b" font-size="9">You know exactly what is running</text>
  <text x="795" y="328" text-anchor="middle" fill="#64748b" font-size="9">and can reproduce it identically</text>
</svg>
