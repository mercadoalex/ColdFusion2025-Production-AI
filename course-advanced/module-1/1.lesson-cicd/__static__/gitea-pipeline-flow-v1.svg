<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,system-ui,sans-serif">
  <rect width="960" height="500" fill="#0f172a" rx="12"/>
  <text x="480" y="34" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="1">LOCAL CI/CD TOOLCHAIN — END TO END</text>

  <!-- Row 1: Developer -->
  <rect x="30" y="54" width="140" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="79" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">Developer</text>
  <text x="100" y="96" text-anchor="middle" fill="#64748b" font-size="10">cf-dev VM</text>
  <text x="100" y="110" text-anchor="middle" fill="#64748b" font-size="10">git commit + push</text>

  <!-- arrow 1 -->
  <line x1="170" y1="84" x2="220" y2="84" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="218,80 226,84 218,88" fill="#3b82f6"/>
  <text x="195" y="76" text-anchor="middle" fill="#64748b" font-size="9">push</text>

  <!-- Gitea -->
  <rect x="220" y="54" width="140" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="290" y="75" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">Gitea</text>
  <text x="290" y="91" text-anchor="middle" fill="#64748b" font-size="10">localhost:3000</text>
  <text x="290" y="107" text-anchor="middle" fill="#64748b" font-size="10">git server + triggers</text>

  <!-- arrow 2 -->
  <line x1="360" y1="84" x2="410" y2="84" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="408,80 416,84 408,88" fill="#3b82f6"/>
  <text x="385" y="76" text-anchor="middle" fill="#64748b" font-size="9">triggers</text>

  <!-- Act Runner -->
  <rect x="410" y="54" width="140" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="72" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">Act Runner</text>
  <text x="480" y="88" text-anchor="middle" fill="#64748b" font-size="10">Gitea Actions worker</text>
  <text x="480" y="104" text-anchor="middle" fill="#64748b" font-size="10">runs on cf-dev</text>

  <!-- Row 2: pipeline steps -->
  <!-- Step A: checkout -->
  <rect x="80" y="168" width="160" height="52" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="187" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">① Checkout</text>
  <text x="160" y="203" text-anchor="middle" fill="#64748b" font-size="10">actions/checkout@v3</text>
  <text x="160" y="216" text-anchor="middle" fill="#64748b" font-size="10">fresh copy of the repo</text>

  <!-- Step B: docker build -->
  <rect x="280" y="168" width="160" height="52" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="360" y="187" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">② docker build</text>
  <text x="360" y="203" text-anchor="middle" fill="#64748b" font-size="10">FROM coldfusion2025:latest</text>
  <text x="360" y="216" text-anchor="middle" fill="#64748b" font-size="10">tags with gitea.sha</text>

  <!-- Step C: docker push -->
  <rect x="480" y="168" width="160" height="52" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="560" y="187" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">③ docker push</text>
  <text x="560" y="203" text-anchor="middle" fill="#64748b" font-size="10">localhost:5000/cf-app</text>
  <text x="560" y="216" text-anchor="middle" fill="#64748b" font-size="10">local image registry</text>

  <!-- Step D: SSH deploy -->
  <rect x="680" y="168" width="160" height="52" rx="6" fill="#14532d" stroke="#22c55e"/>
  <text x="760" y="187" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">④ SSH deploy</text>
  <text x="760" y="203" text-anchor="middle" fill="#64748b" font-size="10">docker pull + docker run</text>
  <text x="760" y="216" text-anchor="middle" fill="#64748b" font-size="10">on cf-prod VM</text>

  <!-- arrows row 2 -->
  <line x1="240" y1="194" x2="280" y2="194" stroke="#475569" stroke-width="1.5"/>
  <polygon points="278,190 286,194 278,198" fill="#475569"/>
  <line x1="440" y1="194" x2="480" y2="194" stroke="#475569" stroke-width="1.5"/>
  <polygon points="478,190 486,194 478,198" fill="#475569"/>
  <line x1="640" y1="194" x2="680" y2="194" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="678,190 686,194 678,198" fill="#22c55e"/>

  <!-- connector from Act Runner down to step row -->
  <line x1="480" y1="114" x2="480" y2="150" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="160" y1="150" x2="760" y2="150" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="160" y1="150" x2="160" y2="168" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="156,166 160,174 164,166" fill="#3b82f6"/>

  <!-- cf-prod box -->
  <rect x="650" y="280" width="250" height="80" rx="8" fill="#0d1f17" stroke="#22c55e" stroke-width="1.5"/>
  <text x="775" y="308" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">cf-prod VM</text>
  <text x="775" y="326" text-anchor="middle" fill="#64748b" font-size="10">docker run localhost:5000/cf-app:sha</text>
  <text x="775" y="342" text-anchor="middle" fill="#64748b" font-size="10">ColdFusion serving real users on :8500</text>

  <!-- connector SSH deploy → cf-prod -->
  <line x1="760" y1="220" x2="760" y2="280" stroke="#22c55e" stroke-width="2"/>
  <polygon points="756,278 760,286 764,278" fill="#22c55e"/>

  <!-- local registry box -->
  <rect x="480" y="280" width="150" height="80" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="555" y="305" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">Local Registry</text>
  <text x="555" y="321" text-anchor="middle" fill="#64748b" font-size="10">localhost:5000</text>
  <text x="555" y="337" text-anchor="middle" fill="#64748b" font-size="10">stores image:sha</text>

  <!-- connector docker push → registry -->
  <line x1="560" y1="220" x2="555" y2="280" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="551,278 555,286 559,278" fill="#a78bfa"/>

  <!-- pull arrow registry → cf-prod -->
  <line x1="630" y1="320" x2="650" y2="320" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="648,316 656,320 648,324" fill="#a78bfa"/>
  <text x="638" y="313" text-anchor="middle" fill="#a78bfa" font-size="9">pull</text>

  <!-- legend -->
  <line x1="40" y1="420" x2="70" y2="420" stroke="#3b82f6" stroke-width="2"/>
  <text x="76" y="424" fill="#64748b" font-size="10">pipeline trigger</text>
  <line x1="180" y1="420" x2="210" y2="420" stroke="#22c55e" stroke-width="2"/>
  <text x="216" y="424" fill="#64748b" font-size="10">deploy</text>
  <line x1="280" y1="420" x2="310" y2="420" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="316" y="424" fill="#64748b" font-size="10">image transfer</text>
  <text x="480" y="424" text-anchor="middle" fill="#64748b" font-size="10">All components run on cf-dev — no internet required</text>
</svg>
