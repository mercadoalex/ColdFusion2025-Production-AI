# =============================================================================
# ColdFusion 2025 Silent Install Properties
# Used with:  ColdFusion_2025_linux64.bin -f silent-install.properties -i silent
#
# NOTE: ColdFusion 2025 requires JDK 21.0.x (bundled inside the installer).
#       The installer places its own JRE at /opt/coldfusion2025/jre/
# =============================================================================

# Installation type: server (single-server install)
installer.install.type=server

# Installation directory
installer.installation.dir=/opt/coldfusion2025

# Select the ColdFusion instance to configure
installer.cf.instance.name=cfusion

# Start ColdFusion after installation? (we manage via systemd)
installer.start.coldfusion=false

# Enable Developer Edition (no license key required)
installer.developer.edition=true
installer.serial.number=

# Admin credentials — pre-set for training environment
# Password: "training" (set via SHA-256 hashed value in neo-security.xml post-install)
installer.admin.username=admin
installer.admin.password=training

# Connector configuration — standalone (no IIS/Apache integration needed)
installer.configure.connector=false
installer.connector.type=none

# Jetty / built-in web server on port 8500
installer.builtin.webserver.configure=true
installer.builtin.webserver.enable=true
installer.builtin.webserver.port=8500

# RDS (Remote Development Services) — disable in training environment
installer.rds.enable=false

# Auto-lockdown (disable in training environment for easier access)
installer.auto.lockdown=false

# Create Windows service? (no — we use systemd)
installer.create.windows.service=false

# Timezone
installer.timezone=UTC

# Accept license
installer.license.accepted=true
