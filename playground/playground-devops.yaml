kind: playground
name: cf-training-devops-3039c6bb
base: flexbox
title: Hungry Minds — ColdFusion 2025 DevOps & Frameworks
description: |-
    Two-VM training environment: CF dev + CF prod.
    Used for Modules 1-3 and Module 5 (DevOps, integrations, ColdBox/TestBox).
    No Ollama node — faster boot than the 3-VM AI playground.
    Course content by Alejandro Mercado / Hungry Minds.
categories:
    - linux
playground:
    networks:
        - name: local
          subnet: 172.16.1.0/24
    machines:
        - name: cf-dev
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - mount: /
              source: oci://ghcr.io/mercadoalex/cf-training:advanced
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 2
            ramSize: 2Gi

        - name: cf-prod
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - mount: /
              source: oci://ghcr.io/mercadoalex/cf-training:advanced
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 2
            ramSize: 2Gi

    tabs:
        - id: terminal-dev
          kind: terminal
          name: Terminal (dev)
          machine: cf-dev
        - id: ide-dev
          kind: ide
          name: IDE
          machine: cf-dev
        - id: http-cf-dev
          kind: http-port
          name: ColdFusion (dev)
          machine: cf-dev
          number: 8500
        - id: http-lucee-dev
          kind: http-port
          name: Lucee (dev)
          machine: cf-dev
          number: 8888
        - id: http-gitea
          kind: http-port
          name: Gitea
          machine: cf-dev
          number: 3000
        - id: terminal-prod
          kind: terminal
          name: Terminal (prod)
          machine: cf-prod
        - id: http-cf-prod
          kind: http-port
          name: ColdFusion (prod)
          machine: cf-prod
          number: 8500

    accessControl:
        canList:
            - owner
        canRead:
            - anyone
        canStart:
            - anyone
